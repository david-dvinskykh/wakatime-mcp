name: release

# Push a tag like v0.1.0 (matching package.json "version") to build the
# binaries, attach them to a GitHub release and, if the NPM_TOKEN secret is
# set, publish the npm package used by `npx -y wakatime-durations-mcp`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check tag matches package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $want" >&2
            exit 1
          fi

      - name: Test
        working-directory: wakatime-durations
        run: go vet ./... && go test ./...

      - name: Build binaries
        working-directory: wakatime-durations
        run: |
          mkdir -p ../dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "../dist/wakatime-durations_${os}_${arch}${ext}" .
          done
          cd ../dist && sha256sum wakatime-durations_* > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish"
            exit 0
          fi
          npm publish --access public --provenance
